name: npm-publish
on:
  push:
    branches:
      - master # Change this to your default branch
permissions:
  id-token: write
  contents: write
jobs:
  npm-publish:
    name: npm-publish
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
    - id: publish
      uses: JS-DevTools/npm-publish@v4
    - name: Create Release
      if: ${{ steps.publish.outputs.type }}
      run: gh release create "${{ steps.publish.outputs.version }}" --title "Release ${{ steps.publish.outputs.version }}" --notes "${{ steps.publish.outputs.version }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
